name: Sincronizar Datos USM (Híbrido Upstream / SIGA Fallback)

on:
  schedule:
    # Sincronización periódica diaria a las 06:00 y 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de sincronización: "upstream" (desde mirror) o "autonomous" (scraper directo SIGA)'
        required: false
        default: 'upstream'
        type: choice
        options:
          - upstream
          - autonomous

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        if: ${{ github.event.inputs.mode != 'autonomous' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar desde Mirror Upstream (Opción C Primaria)
        id: sync_upstream
        if: ${{ github.event.inputs.mode != 'autonomous' }}
        continue-on-error: true
        run: node scripts/sync-upstream-data.mjs

      - name: Configurar Python (Fallback Autónomo SIGA)
        if: ${{ github.event.inputs.mode == 'autonomous' || steps.sync_upstream.outcome == 'failure' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Scraper Autónomo SIGA (Contingencia)
        if: ${{ github.event.inputs.mode == 'autonomous' || steps.sync_upstream.outcome == 'failure' }}
        env:
          SIGA_LOGIN: ${{ secrets.SIGA_LOGIN }}
          SIGA_SERVER: ${{ secrets.SIGA_SERVER }}
          SIGA_PASSWD: ${{ secrets.SIGA_PASSWD }}
          PYTHONPATH: ${{ github.workspace }}/scripts/siga-scraper
        run: |
          pip install -r scripts/siga-scraper/requirements.txt
          python scripts/siga-scraper/generar.py --programas
          if [ -n "$SIGA_LOGIN" ] && [ -n "$SIGA_PASSWD" ]; then
            python scripts/siga-scraper/generar.py --ramos --carreras
          else
            echo "Credenciales SIGA no configuradas en Secrets; sólo se actualizaron programas públicos OAI."
          fi

      - name: Crear Pull Request con catálogos actualizados
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): sincronización automática de catálogos USM"
          branch: "automation/sync-catalogos"
          title: "chore(data): sincronización automática de catálogos USM"
          body: |
            Sincronización periódica automática de catálogos y horarios USM generada por GitHub Actions.
            - Actualizaciones detectadas en `public/data/*.json`.
          delete-branch: true
